name: Generate Mutual Fund AI Content

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of funds to process'
        required: false
        default: '5'
      start_from:
        description: 'Start index (0‑based)'
        required: false
        default: '0'
  schedule:
    - cron: '0 2 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install @supabase/supabase-js openai groq-sdk dotenv sanitize-html ws
      - name: Run AI generation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '5' }}
          START_FROM: ${{ github.event.inputs.start_from || '0' }}
        run: node scripts/generate-mutual-fund-ai-content.js
