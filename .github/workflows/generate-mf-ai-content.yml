name: Generate Mutual Fund AI Content

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of funds to process in this run'
        required: false
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '20'
          - '50'
      start_from:
        description: 'Start from index (0‑based) – useful for resuming'
        required: false
        default: '0'
  schedule:
    # Runs daily at 2:00 AM UTC (7:30 AM IST)
    - cron: '0 2 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours max for large batches

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install @supabase/supabase-js @google/generative-ai groq-sdk dotenv sanitize-html

      - name: Run AI content generation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
          START_FROM: ${{ github.event.inputs.start_from || '0' }}
        run: node scripts/generate-mutual-fund-ai-content.js
