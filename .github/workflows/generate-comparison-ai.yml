name: Generate AI Content for Comparison Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'   # weekly (optional, comment out if not needed)

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install   # 👈 changed from npm ci to npm install

      - name: Run AI content generation script
        run: node scripts/generate-comparison-ai-content.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}

      - name: Commit and push checkpoint (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.github.com"
          git add comparison-ai-checkpoint.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update AI generation checkpoint"
          git push
